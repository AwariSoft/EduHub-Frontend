<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="EduHub Explore Courses — mobile filters and sorting.">
  <title>Filters &amp; Sort | Explore Courses | EduHub</title>
  <!-- Dependencies: Bootstrap 5 / Font Awesome 6 Free / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    /* ==========================================================
       1. Design tokens — Figma 22:42070
       ========================================================== */
    :root { --ed-primary:#2563eb; --ed-primary-hover:#1d4ed8; --ed-text:#0f172a; --ed-muted:#64748b; --ed-border:#e2e8f0; --ed-bg:#f8fafc; --ed-card:#fff; --ed-avatar:#dbeafe; --ed-focus:#2563eb35; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:var(--ed-bg); color:var(--ed-text); font:14px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
    button,input { font:inherit; }
    a { text-decoration:none; color:inherit; }
    a:hover { color:var(--ed-primary); }
    :focus-visible { outline:3px solid var(--ed-focus)!important; outline-offset:3px; }
    [hidden] { display:none!important; }
    .page-shell { width:100%; max-width:520px; margin:0 auto; background:var(--ed-bg); min-height:100dvh; }
    /* ==========================================================
       2. Student header: 196px at 390px viewport
       ========================================================== */
    .student-header { background:var(--ed-card); border-bottom:1px solid var(--ed-border); padding:16px 16px 15px; display:flex; flex-direction:column; gap:16px; }
    .header-top { min-height:44px; }
    .brand { display:inline-flex; align-items:center; gap:8px; color:var(--ed-text); white-space:nowrap; font-size:28px; font-weight:700; letter-spacing:-.8px; line-height:34px; }
    .brand i { color:var(--ed-primary); width:32px; text-align:center; font-size:28px; }
    .brand strong { color:var(--ed-primary); }
    .icon-btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:8px; color:var(--ed-muted); background:transparent; height:44px; width:40px; padding:0; flex:none; }
    .icon-btn:hover,.icon-btn:focus-visible { color:var(--ed-primary); background:#eff6ff; }
    .icon-btn:active { background:#dbeafe; }
    .brand-wrap { min-width:0; gap:8px; }
    .account-tools { gap:8px; }
    .profile-avatar { flex:0 0 40px; display:inline-flex; justify-content:center; align-items:center; width:40px; height:40px; border-radius:50%; background:var(--ed-avatar); color:var(--ed-primary); font-size:13px; font-weight:600; }
    .profile-avatar:hover { color:var(--ed-primary-hover); background:#bfdbfe; }
    .chevron-link { border:0; width:14px; height:44px; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--ed-muted); font-size:12px; }
    .bell-icon { position:relative; }
    .bell-icon::after { content:''; position:absolute; height:6px; width:6px; border-radius:50%; background:var(--ed-primary); top:7px; right:8px; }
    .secondary-nav { height:44px; display:flex; align-items:center; justify-content:space-between; gap:7px; }
    .secondary-nav a { display:flex; align-items:center; height:44px; padding-top:2px; white-space:nowrap; font-size:13px; color:var(--ed-muted); border-bottom:2px solid transparent; }
    .secondary-nav a:hover { color:var(--ed-primary); }
    .secondary-nav .active { color:var(--ed-primary); font-weight:600; border-bottom-color:var(--ed-primary); }
    .global-search { position:relative; display:flex; align-items:center; gap:12px; height:44px; border:1px solid var(--ed-border); border-radius:8px; background:var(--ed-bg); padding:0 12px; }
    .global-search i { color:var(--ed-muted); font-size:16px; }
    .global-search input { border:0; outline:0; background:transparent; width:100%; height:100%; min-width:0; font-size:13px; color:var(--ed-text); }
    .global-search:focus-within { border-color:var(--ed-primary); box-shadow:0 0 0 3px var(--ed-focus); }
    .global-search input::placeholder { color:var(--ed-muted); }
    /* ==========================================================
       3. Filters & Sort page spacing reproduces Figma positions
       ========================================================== */
    .filter-main { padding:16px; }
    .filter-heading-row { height:44px; }
    .filter-page-heading { font-size:28px; font-weight:700; line-height:1.3; letter-spacing:-.45px; margin:0; }
    .close-btn { width:44px; height:44px; border:0; background:transparent; color:var(--ed-muted); border-radius:8px; font-size:20px; }
    .close-btn:hover { background:#eff6ff; color:var(--ed-primary); }
    .filter-intro { color:var(--ed-muted); font-size:14px; line-height:22px; margin:32px 0; }
    .filter-groups { display:flex; flex-direction:column; gap:24px; }
    .filter-group { min-width:0; margin:0; border-color:var(--ed-border)!important; border-radius:12px!important; padding:16px 16px 15px!important; }
    .filter-group-title { float:none; font-size:18px; line-height:22px; font-weight:700; padding:0; margin:0 0 16px; width:100%; }
    .filter-choice { margin:0; min-height:44px; font-size:14px; line-height:22px; cursor:pointer; border-radius:6px; color:var(--ed-text); }
    .filter-choice:not(:last-child) { margin-bottom:16px; }
    .filter-choice:has(input:checked) { color:var(--ed-primary); font-weight:600; }
    .filter-choice:hover { color:var(--ed-primary-hover); }
    .filter-radio { appearance:none; -webkit-appearance:none; flex:0 0 18px; width:18px; height:18px; border:1px solid #94a3b8; background:#fff; border-radius:50%; margin:0; cursor:pointer; }
    .filter-radio:checked { border:5px solid var(--ed-primary); }
    .filter-radio:hover { border-color:var(--ed-primary); }
    .filter-radio:focus-visible { outline:3px solid var(--ed-focus); outline-offset:2px; }
    /* ==========================================================
       4. Actions, footer and interaction feedback
       ========================================================== */
    .btn-ed { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; border-radius:8px; font-size:14px; font-weight:600; padding:10px 18px; transition:color .14s, background .14s, border-color .14s, transform .14s; }
    .btn-ed:active { transform:translateY(1px); }
    .btn-ed-primary { background:var(--ed-primary); color:white; border:1px solid var(--ed-primary); }
    .btn-ed-primary:hover { background:var(--ed-primary-hover); border-color:var(--ed-primary-hover); color:#fff; }
    .btn-ed-outline { background:#fff; color:var(--ed-text); border:1px solid var(--ed-border); }
    .btn-ed-outline:hover { background:#eff6ff; color:var(--ed-primary); border-color:#bfdbfe; }
    .filter-actions { margin-top:32px; display:flex; flex-direction:column; gap:32px; }
    .student-footer { border-top:1px solid var(--ed-border); min-height:63px; padding:23px 16px 24px; text-align:center; font-size:12px; line-height:15px; color:var(--ed-muted); }
    .feedback-toast { position:fixed; z-index:5000; bottom:16px; left:50%; transform:translateX(-50%); border:1px solid var(--ed-border); border-left:4px solid var(--ed-primary); background:#fff; padding:12px 16px; border-radius:8px; max-width:calc(100vw - 32px); box-shadow:0 10px 24px #0f172a20; }
    dialog { border:0; border-radius:12px; box-shadow:0 20px 80px #0f172a40; }
    dialog::backdrop { background:#0f172a80; }
    .nav-dialog { width:min(320px,92vw); padding:20px; margin:0 auto 0 0; height:100dvh; max-height:100dvh; border-radius:0; }
    .nav-dialog a { display:block; padding:12px; border-radius:8px; }
    .nav-dialog a:hover { background:#eff6ff; }
    @media (min-width:768px) { .page-shell { margin:20px auto; border:1px solid var(--ed-border); box-shadow:0 6px 30px #0f172a0a; } }
    @media (max-width:360px) { .brand { font-size:23px; gap:5px; } .brand i { font-size:23px; width:26px; } .account-tools { gap:4px; } .icon-btn { width:32px; } .profile-avatar { flex-basis:36px; width:36px; height:36px; } .secondary-nav a { font-size:12px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <div class="page-shell">
    <!-- ========================================================
         Student Header (same responsive family as Explore Courses)
         ======================================================== -->
    <header class="student-header" aria-label="Student navigation">
      <div class="header-top d-flex justify-content-between align-items-center gap-2">
        <div class="brand-wrap d-flex align-items-center">
          <button type="button" class="icon-btn" id="menuButton" aria-label="Open navigation menu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <a class="brand" href="eduhub-homepage.html" aria-label="EduHub homepage"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>Edu<strong>Hub</strong></span></a>
        </div>
        <div class="account-tools d-flex align-items-center">
          <button type="button" class="icon-btn bell-icon" id="notificationButton" aria-label="Notifications"><i class="fa-regular fa-bell" aria-hidden="true"></i></button>
          <a class="profile-avatar" href="eduhub-student-profile.html" aria-label="Student profile">WM</a>
          <a class="chevron-link" href="eduhub-student-profile.html" aria-label="Open student profile"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></a>
        </div>
      </div>
      <nav class="secondary-nav" aria-label="Primary">
        <a href="eduhub-homepage.html">Home</a>
        <a class="active" href="eduhub-explore-courses.html" aria-current="page">Explore Courses</a>
        <a href="eduhub-student-dashboard.html#my-learning">My Learning</a>
      </nav>
      <label class="global-search" for="headerSearch"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="headerSearch" type="search" placeholder="Search for courses..." autocomplete="off"></label>
    </header>
    <!-- ========================================================
         Filters & Sort (Figma mobile-only state)
         ======================================================== -->
    <main class="filter-main" id="main">
      <div class="filter-heading-row d-flex align-items-start justify-content-between gap-2">
        <h1 class="filter-page-heading">Filters &amp; Sort</h1>
        <button type="button" id="closeFilters" class="close-btn" aria-label="Close filters"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <p class="filter-intro">Find the course that fits your next step.</p>
      <form id="filtersForm" novalidate>
        <div class="filter-groups">
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-category" aria-labelledby="group-label-category"><h2 class="filter-group-title" id="group-label-category">Category</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="category-0">
          <input class="filter-radio" id="category-0" name="category" type="radio" value="all" checked>
          <span>All categories</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-1">
          <input class="filter-radio" id="category-1" name="category" type="radio" value="Programming" >
          <span>Programming</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-2">
          <input class="filter-radio" id="category-2" name="category" type="radio" value="Web Development" >
          <span>Web Development</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-3">
          <input class="filter-radio" id="category-3" name="category" type="radio" value="Databases" >
          <span>Databases</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-level" aria-labelledby="group-label-level"><h2 class="filter-group-title" id="group-label-level">Course Level</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="level-0">
          <input class="filter-radio" id="level-0" name="level" type="radio" value="all" checked>
          <span>All levels</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-1">
          <input class="filter-radio" id="level-1" name="level" type="radio" value="Beginner" >
          <span>Beginner</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-2">
          <input class="filter-radio" id="level-2" name="level" type="radio" value="Intermediate" >
          <span>Intermediate</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-3">
          <input class="filter-radio" id="level-3" name="level" type="radio" value="Advanced" >
          <span>Advanced</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-price" aria-labelledby="group-label-price"><h2 class="filter-group-title" id="group-label-price">Price</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="price-0">
          <input class="filter-radio" id="price-0" name="price" type="radio" value="all" checked>
          <span>Free &amp; Paid</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="price-1">
          <input class="filter-radio" id="price-1" name="price" type="radio" value="free" >
          <span>Free</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="price-2">
          <input class="filter-radio" id="price-2" name="price" type="radio" value="paid" >
          <span>Paid</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-rating" aria-labelledby="group-label-rating"><h2 class="filter-group-title" id="group-label-rating">Rating</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-0">
          <input class="filter-radio" id="rating-0" name="rating" type="radio" value="all" checked>
          <span>All ratings</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-1">
          <input class="filter-radio" id="rating-1" name="rating" type="radio" value="4.5" >
          <span>4.5 &amp; up</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-2">
          <input class="filter-radio" id="rating-2" name="rating" type="radio" value="4.0" >
          <span>4.0 &amp; up</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-3">
          <input class="filter-radio" id="rating-3" name="rating" type="radio" value="3.5" >
          <span>3.5 &amp; up</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-sort" aria-labelledby="group-label-sort"><h2 class="filter-group-title" id="group-label-sort">Sort</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-0">
          <input class="filter-radio" id="sort-0" name="sort" type="radio" value="popularity" checked>
          <span>Popularity</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-1">
          <input class="filter-radio" id="sort-1" name="sort" type="radio" value="newest" >
          <span>Newest</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-2">
          <input class="filter-radio" id="sort-2" name="sort" type="radio" value="rating" >
          <span>Highest Rated</span>
        </label>
</fieldset>
        </div>
        <div class="filter-actions">
          <button id="showCourses" type="submit" class="btn-ed btn-ed-primary">Show 6 Courses</button>
          <button id="resetFilters" type="button" class="btn-ed btn-ed-outline">Reset Filters</button>
        </div>
      </form>
    </main>
    <footer class="student-footer">EduHub · Learn Today. Build Tomorrow.</footer>
  </div>
  <!-- Working mobile navigation menu -->
  <dialog id="navigationDialog" class="nav-dialog" aria-label="Navigation menu">
    <div class="d-flex align-items-center justify-content-between mb-3"><strong>EduHub</strong><button class="icon-btn" type="button" id="closeNav" aria-label="Close menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
    <nav aria-label="Mobile menu">
      <a href="eduhub-homepage.html">Home</a><a href="eduhub-explore-courses.html">Explore Courses</a><a href="eduhub-student-dashboard.html#my-learning">My Learning</a><a href="eduhub-student-profile.html">My Profile</a><a href="eduhub-sign-in.html">Sign In</a>
    </nav>
  </dialog>
  <div class="feedback-toast" id="notice" role="status" aria-live="polite" hidden></div>
  <script>
    'use strict';
    // --------------------------------------------------------------
    // Filter state is sourced only from the six catalog demo courses.
    // No backend queries or persistence are performed.
    // --------------------------------------------------------------
    const courses = [
      {category:'Programming', level:'Beginner to Intermediate', price:49, rating:4.8},
      {category:'Web Development', level:'Beginner', price:29, rating:4.7},
      {category:'Databases', level:'Intermediate', price:39, rating:4.8},
      {category:'Web Development', level:'Beginner', price:35, rating:4.8},
      {category:'Web Development', level:'Intermediate', price:59, rating:4.9},
      {category:'Databases', level:'Beginner', price:0, rating:4.7}
    ];
    const defaults = Object.freeze({category:'all', level:'all', price:'all', rating:'all', sort:'popularity'});
    const allowed = Object.freeze({
      category:['all','Programming','Web Development','Databases'],
      level:['all','Beginner','Intermediate','Advanced'],
      price:['all','free','paid'], rating:['all','4.5','4.0','3.5'],
      sort:['popularity','newest','rating']
    });
    const form = document.getElementById('filtersForm');
    const search = document.getElementById('headerSearch');
    const params = new URLSearchParams(window.location.search);
    const keys = Object.keys(defaults);
    const initial = {};
    for (const key of keys) initial[key] = allowed[key].includes(params.get(key)) ? params.get(key) : defaults[key];
    for (const [key,value] of Object.entries(initial)) form.querySelector(`input[name="${key}"][value="${CSS.escape(value)}"]`).checked=true;
    search.value = params.get('q') || '';
    function readFilters() {
      const result = {};
      for (const key of keys) result[key] = form.elements[key].value;
      return result;
    }
    function countMatching(filters) {
      return courses.filter(course => {
        const q=(search.value||'').trim().toLowerCase();
        // The catalog performs title matching, not general full-text search.
        const titles=['complete c# programming','html & css fundamentals','sql server essentials','javascript for beginners','asp.net core web development','database design fundamentals'];
        const title=titles[courses.indexOf(course)];
        return title.includes(q) && (filters.category==='all'||course.category===filters.category)
          && (filters.level==='all'||course.level===filters.level||course.level.split(' to ').includes(filters.level))
          && (filters.price==='all'||(filters.price==='free'&&course.price===0)||(filters.price==='paid'&&course.price>0))
          && (filters.rating==='all'||course.rating>=Number(filters.rating));
      }).length;
    }
    function refreshCount() {
      const n=countMatching(readFilters());
      document.getElementById('showCourses').textContent=`Show ${n} ${n===1?'Course':'Courses'}`;
    }
    form.addEventListener('change',refreshCount);
    search.addEventListener('input',refreshCount);
    function catalogUrl(current=false) {
      const finalParams = current ? new URLSearchParams(window.location.search) : new URLSearchParams();
      if (!current) {
        const picked=readFilters();
        for (const key of keys) if(picked[key]!==defaults[key]) finalParams.set(key,picked[key]);
        if(search.value.trim()) finalParams.set('q',search.value.trim());
      }
      const suffix=finalParams.toString();
      return 'eduhub-explore-courses.html'+(suffix?'?'+suffix:'')+(current?'':'#catalogRegion');
    }
    document.getElementById('closeFilters').addEventListener('click',()=>{window.location.href=catalogUrl(true)});
    form.addEventListener('submit',e=>{e.preventDefault();window.location.href=catalogUrl(false)});
    document.getElementById('resetFilters').addEventListener('click',()=>{
      for(const key of keys) form.querySelector(`input[name="${key}"][value="${CSS.escape(defaults[key])}"]`).checked=true;
      search.value=''; refreshCount();
    });
    const notice=document.getElementById('notice');
    document.getElementById('notificationButton').addEventListener('click',()=>{ notice.textContent='The Notifications screen is not connected yet.';notice.hidden=false; });
    notice.addEventListener('click',()=>notice.hidden=true);
    const navigationDialog=document.getElementById('navigationDialog');
    document.getElementById('menuButton').addEventListener('click',()=>navigationDialog.showModal());
    document.getElementById('closeNav').addEventListener('click',()=>navigationDialog.close());
    navigationDialog.addEventListener('click',e=>{if(e.target===navigationDialog)navigationDialog.close();});
    if(window.location.hash==='#sort') document.getElementById('group-sort').scrollIntoView({block:'start'});
    refreshCount();
  </script>
</body>
</html>
