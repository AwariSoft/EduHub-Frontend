<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="EduHub Explore Courses — mobile filters and sorting.">
  <title>Filters &amp; Sort | Explore Courses | EduHub</title>
  <!-- Dependencies: Bootstrap 5 / Font Awesome 6 Free / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/recovered/explore-courses-mobile-filters-open.css" data-eduhub-restored="page-css">
</head>
<body>
  <div class="page-shell">
    <!-- ========================================================
         Student Header (same responsive family as Explore Courses)
         ======================================================== -->
    <header class="student-header" aria-label="Student navigation">
      <div class="header-top d-flex justify-content-between align-items-center gap-2">
        <div class="brand-wrap d-flex align-items-center">
          <button type="button" class="icon-btn" id="menuButton" aria-label="Open navigation menu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <a class="brand" href="../public/home.html" aria-label="EduHub homepage"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>Edu<strong>Hub</strong></span></a>
        </div>
        <div class="account-tools d-flex align-items-center">
          <button type="button" class="icon-btn bell-icon" id="notificationButton" aria-label="Notifications"><i class="fa-regular fa-bell" aria-hidden="true"></i></button>
          <a class="profile-avatar" href="../student/student-profile.html" aria-label="Student profile">WM</a>
          <a class="chevron-link" href="../student/student-profile.html" aria-label="Open student profile"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></a>
        </div>
      </div>
      <nav class="secondary-nav" aria-label="Primary">
        <a href="../public/home.html">Home</a>
        <a class="active" href="../public/explore-courses.html" aria-current="page">Explore Courses</a>
        <a href="../student/dashboard.html#my-learning">My Learning</a>
      </nav>
      <label class="global-search" for="headerSearch"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="headerSearch" type="search" placeholder="Search for courses..." autocomplete="off"></label>
    </header>
    <!-- ========================================================
         Filters & Sort (Figma mobile-only state)
         ======================================================== -->
    <main class="filter-main" id="main">
      <div class="filter-heading-row d-flex align-items-start justify-content-between gap-2">
        <h1 class="filter-page-heading">Filters &amp; Sort</h1>
        <button type="button" id="closeFilters" class="close-btn" aria-label="Close filters"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <p class="filter-intro">Find the course that fits your next step.</p>
      <form id="filtersForm" novalidate>
        <div class="filter-groups">
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-category" aria-labelledby="group-label-category"><h2 class="filter-group-title" id="group-label-category">Category</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="category-0">
          <input class="filter-radio" id="category-0" name="category" type="radio" value="all" checked>
          <span>All categories</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-1">
          <input class="filter-radio" id="category-1" name="category" type="radio" value="Programming" >
          <span>Programming</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-2">
          <input class="filter-radio" id="category-2" name="category" type="radio" value="Web Development" >
          <span>Web Development</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="category-3">
          <input class="filter-radio" id="category-3" name="category" type="radio" value="Databases" >
          <span>Databases</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-level" aria-labelledby="group-label-level"><h2 class="filter-group-title" id="group-label-level">Course Level</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="level-0">
          <input class="filter-radio" id="level-0" name="level" type="radio" value="all" checked>
          <span>All levels</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-1">
          <input class="filter-radio" id="level-1" name="level" type="radio" value="Beginner" >
          <span>Beginner</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-2">
          <input class="filter-radio" id="level-2" name="level" type="radio" value="Intermediate" >
          <span>Intermediate</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="level-3">
          <input class="filter-radio" id="level-3" name="level" type="radio" value="Advanced" >
          <span>Advanced</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-price" aria-labelledby="group-label-price"><h2 class="filter-group-title" id="group-label-price">Price</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="price-0">
          <input class="filter-radio" id="price-0" name="price" type="radio" value="all" checked>
          <span>Free &amp; Paid</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="price-1">
          <input class="filter-radio" id="price-1" name="price" type="radio" value="free" >
          <span>Free</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="price-2">
          <input class="filter-radio" id="price-2" name="price" type="radio" value="paid" >
          <span>Paid</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-rating" aria-labelledby="group-label-rating"><h2 class="filter-group-title" id="group-label-rating">Rating</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-0">
          <input class="filter-radio" id="rating-0" name="rating" type="radio" value="all" checked>
          <span>All ratings</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-1">
          <input class="filter-radio" id="rating-1" name="rating" type="radio" value="4.5" >
          <span>4.5 &amp; up</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-2">
          <input class="filter-radio" id="rating-2" name="rating" type="radio" value="4.0" >
          <span>4.0 &amp; up</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="rating-3">
          <input class="filter-radio" id="rating-3" name="rating" type="radio" value="3.5" >
          <span>3.5 &amp; up</span>
        </label>
</fieldset>
<fieldset class="filter-group rounded-3 border bg-white p-3" id="group-sort" aria-labelledby="group-label-sort"><h2 class="filter-group-title" id="group-label-sort">Sort</h2>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-0">
          <input class="filter-radio" id="sort-0" name="sort" type="radio" value="popularity" checked>
          <span>Popularity</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-1">
          <input class="filter-radio" id="sort-1" name="sort" type="radio" value="newest" >
          <span>Newest</span>
        </label>
<label class="filter-choice d-flex align-items-center gap-3" for="sort-2">
          <input class="filter-radio" id="sort-2" name="sort" type="radio" value="rating" >
          <span>Highest Rated</span>
        </label>
</fieldset>
        </div>
        <div class="filter-actions">
          <button id="showCourses" type="submit" class="btn-ed btn-ed-primary">Show 6 Courses</button>
          <button id="resetFilters" type="button" class="btn-ed btn-ed-outline">Reset Filters</button>
        </div>
      </form>
    </main>
    <footer class="student-footer">EduHub · Learn Today. Build Tomorrow.</footer>
  </div>
  <!-- Working mobile navigation menu -->
  <dialog id="navigationDialog" class="nav-dialog" aria-label="Navigation menu">
    <div class="d-flex align-items-center justify-content-between mb-3"><strong>EduHub</strong><button class="icon-btn" type="button" id="closeNav" aria-label="Close menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
    <nav aria-label="Mobile menu">
      <a href="../public/home.html">Home</a><a href="../public/explore-courses.html">Explore Courses</a><a href="../student/dashboard.html#my-learning">My Learning</a><a href="../student/student-profile.html">My Profile</a><a href="../auth/sign-in.html">Sign In</a>
    </nav>
  </dialog>
  <div class="feedback-toast" id="notice" role="status" aria-live="polite" hidden></div>
  <script src="../../assets/js/recovered/explore-courses-mobile-filters-open.js" data-eduhub-restored="page-js"></script>
</body>
</html>
