<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./edu-hub-sign-in-mobile.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div class="eduhub-sign-in-mobile">
      <header class="page-navigation2">
        <div class="new-account-navigation-container">
          <span class="dont-have-an">Don't have an account? </span>
          <span class="sign-up">Sign Up</span>
        </div>
      </header>
      <section class="brand-introduction2">
        <div class="eduhub-brand2">
          <img
            class="graduation-cap-icon2"
            alt=""
            src="./public/Graduation-cap.svg"
          />

          <h1 class="wordmark">
            <span>Edu</span>
            <span class="hub2">Hub</span>
          </h1>
        </div>
        <div class="brand-promise">
          <div class="tagline">Learn Today. Build Tomorrow.</div>
          <div class="platform-description2">
            Access high-quality courses, learn at your own pace, and achieve
            your goals with EduHub.
          </div>
        </div>
      </section>
      <section class="sign-in-card">
        <div class="form-heading2">
          <h3 class="title2">Welcome Back</h3>
          <div class="subtitle2">Sign in to your EduHub account</div>
        </div>
        <div class="account-details2">
          <div class="email-address-input2">
            <div class="label7">Email Address</div>
            <div class="input5">
              <img class="mail-icon2" alt="" src="./public/mail.svg" />

              <input
                class="placeholder5"
                placeholder="you@example.com"
                type="text"
              />
            </div>
          </div>
          <div class="email-address-input2">
            <div class="label7">Password</div>
            <div class="input5">
              <img class="mail-icon2" alt="" src="./public/lock-keyhole.svg" />

              <input
                class="placeholder6"
                placeholder="Enter your password"
                type="text"
              />

              <img class="mail-icon2" alt="" src="./public/eye.svg" />
            </div>
          </div>
        </div>
        <div class="sign-in-preferences">
          <div class="remember-me-unchecked">
            <input class="checkbox-unchecked" type="checkbox" />

            <div class="checkbox-label">Remember me</div>
          </div>
          <div class="password-recovery">Forgot password?</div>
        </div>
        <div class="sign-in-actions">
          <button class="log-in-button">
            <b class="label9">Log In →</b>
          </button>
          <div class="alternative-divider2">
            <div class="divider3"></div>
            <div class="checkbox-label">or</div>
            <div class="divider3"></div>
          </div>
          <button class="continue-with-google-button2">
            <img
              class="google-logo-icon2"
              alt=""
              src="./public/Google-logo.svg"
            />

            <div class="label10">Continue with Google</div>
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
