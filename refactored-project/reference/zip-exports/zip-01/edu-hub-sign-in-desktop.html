<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./edu-hub-sign-in-desktop.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div class="eduhub-sign-in-desktop">
      <header class="page-navigation2">
        <div class="new-account-navigation-container">
          <span class="dont-have-an">Don't have an account? </span>
          <span class="sign-up">Sign Up</span>
        </div>
      </header>
      <main class="sign-in-layout">
        <section class="learning-introduction2">
          <div class="brand-introduction2">
            <div class="eduhub-brand5">
              <img
                class="graduation-cap-icon8"
                loading="lazy"
                alt=""
                src="./public/Graduation-cap.svg"
              />

              <h1 class="wordmark4">
                <span>Edu</span>
                <span class="hub5">Hub</span>
              </h1>
            </div>
            <h2 class="tagline2">Learn Today. Build Tomorrow.</h2>
            <div class="platform-description2">
              Access high-quality courses, learn at your own pace, and achieve
              your goals with EduHub.
            </div>
          </div>
          <img
            class="learning-workspace-illustratio2"
            loading="lazy"
            alt=""
            src="./public/Learning-workspace-illustration@2x.png"
          />
        </section>
        <section class="sign-in-panel">
          <form class="sign-in-card">
            <div class="form-heading2">
              <h2 class="title8">Welcome Back</h2>
              <div class="subtitle2">Sign in to your EduHub account</div>
            </div>
            <div class="account-details2">
              <div class="email-address-input-focused">
                <div class="label38">Email Address</div>
                <div class="input15">
                  <img class="mail-icon2" alt="" src="./public/mail.svg" />

                  <input
                    class="placeholder15"
                    placeholder="you@example.com"
                    type="text"
                  />
                </div>
              </div>
              <div class="password-input2">
                <div class="label38">Password</div>
                <div class="input16">
                  <img
                    class="lock-keyhole-icon5"
                    type="submit"
                    alt=""
                    src="./public/lock-keyhole.svg"
                  />

                  <input
                    class="placeholder16"
                    placeholder="Enter your password"
                    type="text"
                  />

                  <img class="eye-icon3" alt="" src="./public/eye.svg" />
                </div>
              </div>
            </div>
            <div class="sign-in-preferences">
              <div class="remember-me-unchecked">
                <input class="checkbox-unchecked" type="checkbox" />

                <div class="checkbox-label">Remember me</div>
              </div>
              <div class="password-recovery">Forgot password?</div>
            </div>
            <div class="sign-in-actions">
              <button class="log-in-button" type="submit">
                <b class="label40">Log In →</b>
              </button>
              <div class="alternative-divider2">
                <div class="divider6"></div>
                <div class="alternative-label2">or</div>
                <div class="divider6"></div>
              </div>
              <button class="continue-with-google-button2" type="submit">
                <img class="mail-icon2" alt="" src="./public/Google-logo.svg" />

                <div class="label41">Continue with Google</div>
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
